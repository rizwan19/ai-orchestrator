spring.application.name=chat-backend
# Paths are relative to the repository root, the working directory for both
# `./gradlew :backend:bootRun` and IDE run configurations.
# Local secrets (OPENROUTER_API_KEY=...) live in backend/.env, which git ignores.
spring.config.import=optional:file:backend/.env[.properties]
spring.docker.compose.file=backend/compose.yaml

server.port=8080
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
server.servlet.session.cookie.same-site=lax

app.openrouter.base-url=https://openrouter.ai/api/v1
app.openrouter.api-key=${OPENROUTER_API_KEY:}
app.openrouter.app-name=YourBrand
app.openrouter.app-url=http://localhost:3000

# Curated, low-cost models. The first entry is the default.
app.chat.models[0].id=anthropic/claude-haiku-5.5
app.chat.models[0].label=Claude Haiku 5.5
app.chat.models[1].id=openai/gpt-6-luna
app.chat.models[1].label=GPT-6 Luna
app.chat.models[2].id=deepseek/deepseek-v4.1-flash
app.chat.models[2].label=DeepSeek V4.1 Flash

# OpenRouter reports cost in credits (1 credit = 1 USD).
app.chat.daily-budget-usd=0.50
app.chat.budget-zone=Asia/Dhaka
app.chat.max-message-length=8000
# Earlier messages sent as context with each request.
app.chat.history-limit=30
